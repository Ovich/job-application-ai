<!--
  The dimmed page. It takes the press that leaves, and nothing else: the panel above it
  stops its own presses from reaching here.
-->
<div
  data-backdrop
  class="absolute inset-0 bg-foreground/30 backdrop-blur-[1px]"
  (click)="leaveIfOutside($event)"
></div>

<div
  data-panel
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  [attr.aria-labelledby]="titleId"
  [class]="
    'relative flex max-h-[calc(100dvh-2rem)] w-full flex-col overflow-hidden rounded-lg border border-border bg-card shadow-card outline-none ' +
    panelWidth()
  "
>
  <div class="flex items-start gap-4 border-border border-b px-6 py-4">
    <h2 [id]="titleId" uiText weight="semibold" class="min-w-0 flex-1">{{ title() }}</h2>

    @if (dismissible()) {
      <button
        type="button"
        aria-label="Close"
        class="-me-2 -mt-1 rounded-md px-2 py-1 text-muted-foreground hover:bg-muted hover:text-foreground"
        (click)="leave()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    }
  </div>

  <!--
    The content, and the only thing that scrolls: the panel itself is bounded by the
    viewport, so a long form moves inside it and the page behind it does not move at all.
  -->
  <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
    <ng-content />
  </div>
</div>
