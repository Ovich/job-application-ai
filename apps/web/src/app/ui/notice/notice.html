<div
  uiRow
  gap="md"
  align="start"
  uiBox
  [surface]="surface()"
  radius="md"
  px="lg"
  py="md"
  uiText
  variant="ui"
  [tone]="tone()"
>
  <span
    class="mt-[0.45em] size-2.5 shrink-0 bg-current"
    [class.rounded-full]="tone() === 'ok'"
    aria-hidden="true"
  ></span>
  <span>
    <span uiText variant="ui" [tone]="tone()" weight="semibold">{{ lead() }}</span
    >&ngsp;<ng-content />
  </span>
</div>
