<div
  uiRow
  gap="md"
  class="min-h-16 flex-wrap border-border border-b bg-card px-4 py-2 lg:flex-nowrap lg:px-7 lg:py-0"
>
  <span class="flex min-w-0 flex-col leading-tight max-lg:w-full">
    <b uiText variant="ui" weight="semibold" class="truncate">{{ name() }}</b>
    <small uiText variant="caption" tone="muted" class="truncate">{{ readLine() }}</small>
  </span>

  <span class="ms-auto max-lg:hidden"></span>

  <button
    hlmBtn
    variant="secondary"
    size="sm"
    type="button"
    class="lg:hidden"
    data-action="toggle-view"
    (click)="toggleView.emit()"
  >
    {{ view() === "sheet" ? "Back to the chat" : "See my profile" }}
  </button>

  <!--
    The way to the documents screen (SL11). Everything else on this bar is a button that
    acts here; this is a link, because it goes somewhere, and it is the only thing that
    points at `/documents` once a profile exists.
  -->
  <a
    hlmBtn
    variant="ghost"
    size="sm"
    href="/documents"
    routerLink="/documents"
    class="ms-auto lg:ms-0"
  >
    My documents
  </a>

  <button hlmBtn variant="secondary" size="sm" type="button" (click)="addDocuments.emit()">
    Add documents
  </button>

  <button hlmBtn size="sm" type="button" (click)="startApplication.emit()">
    Start an application
  </button>
</div>
