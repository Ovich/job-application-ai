@if (asked(); as question) {
  <span data-part="where" uiText variant="caption" tone="muted" class="mb-1 block">{{
    question.where
  }}</span>

  <p data-part="lead" uiText variant="ui" class="mb-3">{{ question.lead }}</p>

  <!--
    The answers as rows: a ToggleGroup in behaviour (single, nothing preselected) and rows
    in appearance. The radio glyph is the ::before circle, filled in the one blue when the
    row is the chosen one.
  -->
  <fieldset class="-mx-2 flex flex-col border-0 p-0" aria-label="Your answer">
    @for (option of question.options; track option.id) {
      <button
        type="button"
        data-action="alt"
        [attr.data-own]="option.rule === null ? '1' : null"
        [attr.data-rule]="option.rule"
        [attr.aria-pressed]="picked() === option.id"
        (click)="choose(option)"
        class="relative block w-full rounded-md border-border border-t py-2 pe-2 ps-[34px] text-left leading-snug first:border-t-0 hover:bg-muted aria-pressed:bg-accent aria-pressed:text-primary before:absolute before:start-2 before:top-3 before:size-3.5 before:rounded-full before:border-[1.5px] before:border-input before:bg-card before:content-[''] aria-pressed:before:border-primary aria-pressed:before:bg-primary aria-pressed:before:shadow-[inset_0_0_0_2.5px_var(--card)]"
      >
        <span data-part="label" uiText variant="ui">{{ option.label }}</span>
        <small uiText variant="caption" tone="muted" class="block aria-pressed:text-primary">{{
          option.hint
        }}</small>
      </button>
    }
  </fieldset>

  <p
    data-part="foot"
    uiText
    variant="caption"
    tone="muted"
    class="mt-3 flex flex-wrap items-center gap-3"
  >
    <span>Pick one, or say it in your own words below.</span>
    <button
      type="button"
      data-action="skip"
      (click)="skip.emit()"
      class="p-0 underline underline-offset-[3px] hover:text-primary"
    >
      Skip, ask me in the builder
    </button>
  </p>
} @else {
  <!--
    The tool the person opened themselves: one sentence, the same wherever it is opened,
    and no option anywhere. What is in scope is said by the prefix alone, in the clicked
    thing's own text.
  -->
  <p data-part="lead" uiText variant="ui" class="mb-3">
    Tell me what I should know about it, in your own words.
  </p>

  <p
    data-part="foot"
    uiText
    variant="caption"
    tone="muted"
    class="mt-3 flex flex-wrap items-center gap-3"
  >
    <span>What you write is kept as your rule for it.</span>
    <button
      type="button"
      data-action="cancel"
      (click)="cancel.emit()"
      class="p-0 underline underline-offset-[3px] hover:text-primary"
    >
      Cancel
    </button>
  </p>
}
