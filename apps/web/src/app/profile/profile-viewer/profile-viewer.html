<profile-bar
  [name]="name()"
  [readLine]="readLine()"
  [view]="view()"
  (addDocuments)="addDocuments()"
  (toggleView)="toggleView.emit()"
/>

<!--
  The scrolling column. The reveal is computed against this element's own rect and
  moves its own `scrollTop`: it scrolls inside the shell, and `scrollIntoView` would
  also move whatever contains it.
-->
<div #scroller [class]="scrollClass()">
  @switch (state()) {
    @case ("loading") {
      <div uiSpinner></div>
    }
    @default {
      @if (profile(); as loaded) {
        <profile-sheet
          [profile]="loaded"
          [focused]="focused()"
          [selected]="lifted()"
          (select)="chosen($event)"
          (overlayPressed)="overlayPressed()"
        />
      }
    }
  }
</div>

<!-- The drop zone over the profile (`ID160`, D15), drawn from the Documents this section provides. -->
@if (adding()) {
  <add-documents-modal (closed)="adding.set(false)" (done)="documentsAdded()" />
}
