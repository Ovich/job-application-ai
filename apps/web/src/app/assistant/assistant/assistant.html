<!--
  The conversation, whosever it is. Everything a use case writes lands here; the one
  thing that does not is what it marks `assistantTool`, which goes into the dock below.
-->
<div class="flex min-h-0 flex-1 flex-col gap-5 overflow-auto p-6">
  <ng-content />
</div>

<composer [tool]="tool()" [canSave]="canSave()" (save)="save.emit()" (clear)="clear.emit()">
  <ng-content select="[assistantTool]" />
</composer>
