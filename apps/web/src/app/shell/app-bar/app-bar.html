<app-wordmark class="text-[18px]" />
<ng-container [ngTemplateOutlet]="nav" />
<span class="flex-1"></span>
<ng-container [ngTemplateOutlet]="meter" />
<ng-container [ngTemplateOutlet]="accountSlot" />

<!-- The nav: Profile is the one route there is; Applications and Credits are drawn inert (F3). -->
<ng-template #nav>
  <nav class="ml-3 hidden gap-1 sm:flex">
    <a
      href="/profile"
      routerLink="/profile"
      class="rounded-md bg-accent px-3 py-1.5 text-ui font-semibold text-accent-foreground no-underline"
      aria-current="page"
    >
      Profile
    </a>
    <span class="rounded-md px-3 py-1.5 text-ui text-muted-foreground" aria-disabled="true">
      Applications
    </span>
    <span class="rounded-md px-3 py-1.5 text-ui text-muted-foreground" aria-disabled="true">
      Credits
    </span>
  </nav>
</ng-template>

<!-- The CreditMeter, drawn inert with the mockup's figure (F3). -->
<ng-template #meter>
  <span class="hidden text-ui text-muted-foreground sm:inline">
    CHF <span class="font-semibold text-foreground">12.40</span>
  </span>
</ng-template>

<!-- The account slot: the initials, and the menu under them while it is open. -->
<ng-template #accountSlot>
  <div class="relative">
    <button
      type="button"
      class="flex size-[34px] items-center justify-center rounded-full border border-border bg-accent text-caption font-semibold text-accent-foreground"
      aria-label="Your account"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      {{ initials() }}
    </button>
    @if (menuOpen()) {
      <app-account-menu
        [user]="user()"
        (signOut)="forward(signOut)"
        (deleteAccount)="forward(deleteAccount)"
      />
    }
  </div>
</ng-template>
