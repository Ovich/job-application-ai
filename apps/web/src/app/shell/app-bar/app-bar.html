<div uiRow gap="lg" uiBox surface="card" px="lg" class="h-[60px] shrink-0 border-b border-border">
  <app-wordmark />
  <ng-container [ngTemplateOutlet]="nav" />
  <span uiSpacer></span>
  <ng-container [ngTemplateOutlet]="meter" />
  <ng-container [ngTemplateOutlet]="accountSlot" />
</div>

<!-- The nav: Profile is the one route there is; Applications and Credits are drawn inert (F3). -->
<ng-template #nav>
  <nav uiRow gap="xs" class="ml-3 hidden sm:flex">
    <a
      href="/profile"
      routerLink="/profile"
      uiBox
      px="md"
      py="xs"
      radius="md"
      surface="accent"
      uiText
      variant="ui"
      weight="semibold"
      class="text-accent-foreground no-underline"
      aria-current="page"
    >
      Profile
    </a>
    <span uiBox px="md" py="xs" radius="md" uiText variant="ui" tone="muted" aria-disabled="true">
      Applications
    </span>
    <span uiBox px="md" py="xs" radius="md" uiText variant="ui" tone="muted" aria-disabled="true">
      Credits
    </span>
  </nav>
</ng-template>

<!-- The CreditMeter, drawn inert with the mockup's figure (F3). -->
<ng-template #meter>
  <span uiText variant="ui" tone="muted" class="hidden sm:inline">
    CHF <span uiText variant="ui" weight="semibold">12.40</span>
  </span>
</ng-template>

<!-- The account slot: the initials, and the menu under them while it is open. -->
<ng-template #accountSlot>
  <div class="relative">
    <button
      type="button"
      uiRow
      gap="none"
      justify="center"
      uiBox
      surface="accent"
      border
      uiText
      variant="caption"
      weight="semibold"
      class="size-[34px] rounded-full text-accent-foreground"
      aria-label="Your account"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      {{ initials() }}
    </button>
    @if (menuOpen()) {
      <app-account-menu
        class="absolute top-11 right-0 z-10 w-[270px]"
        [user]="user()"
        (signOut)="forward(signOut)"
        (deleteAccount)="forward(deleteAccount)"
      />
    }
  </div>
</ng-template>
