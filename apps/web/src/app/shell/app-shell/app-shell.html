<div uiStack gap="none" class="h-dvh overflow-hidden">
  @if (user(); as user) {
    <div class="relative">
      <app-bar [user]="user" (signOut)="signOut()" (deleteAccount)="openDeletion()" />
      <!-- Under the account slot, where the menu was: the bar's padding from the right, just below the slot. -->
      @if (deletion(); as open) {
        <app-delete-account
          class="absolute top-[57px] right-4 z-10 max-w-[calc(100%-2rem)]"
          [providers]="user.providers"
          [working]="open.working"
          [failed]="open.failed"
          (confirm)="deleteAccount()"
          (cancel)="closeDeletion()"
        />
      }
    </div>
  }
  <main uiPage><router-outlet /></main>
</div>
