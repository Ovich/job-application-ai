AWSTemplateFormatVersion: "2010-09-09"

# Everything that can be destroyed and rebuilt from this repository: the function, the
# bundle, and the distribution that serves both under one name.
#
# Region: eu-central-1.
#
# The one name matters beyond tidiness. Page and API share an origin, so the browser
# makes no cross-origin request, nothing has to be configured for CORS, and the RPC
# client never learns a host (ID5). That is why /api/* is a behaviour on this
# distribution rather than a second address.
#
# Two things reach this stack from outside CloudFormation's own graph, and both are
# parameters rather than magic: the key of the function's bundle, which the pipeline
# builds and uploads, and the certificate's ARN, which lives in us-east-1 and cannot be
# imported across the region boundary.
Description: The development API, web bundle and distribution. Rebuildable from the repository.

Parameters:
  ApiArtefactKey:
    Type: String
    Description: >-
      Key, in the Deploy stack's artefact bucket, of the zip esbuild produced from
      apps/api/src/lambda.ts. The pipeline uploads it under the commit SHA, which is what
      makes a deploy of unchanged code a no-op and a deploy of changed code a new version.

  CertificateArn:
    Type: String
    Description: >-
      The ARN of the Cert-dev certificate, read from that stack's output in us-east-1.
    AllowedPattern: ^arn:aws:acm:us-east-1:\d{12}:certificate/.+$

  # Switching the AI from the mock to a provider is the address, the key's entry and the
  # model on a deploy, plus the deploy role's grant on that entry, and no code (goal 9,
  # ID195, ID234). All default to the mock, so a deploy that names none is the
  # environment as it has always been.
  AiBaseUrl:
    Type: String
    Default: https://dev.job-application.app/mock/v1
    Description: >-
      Where the reading and the assistants ask for answers, ending at the /v1-equivalent.
      The default is this app's own mock, which the function answers in process.

  # The NAME of a Secrets Manager entry, never a key (ID214): a parameter's value is shown
  # in the console, in describe-stacks and in the pipeline's command, so the key itself is
  # resolved from the entry while the stack applies, as every other secret here is. Empty
  # means no key at all. The deploy role must also be granted the entry before it is set
  # (Deploy.yaml), which is not done yet.
  AiKeyEntry:
    Type: String
    Default: ""
    Description: >-
      Name of the Secrets Manager entry whose SecretString is the AI provider's key, or
      empty for the mock, which needs none.

  # Without it the function falls back to the schema's mock-model, and a provider reached
  # by address and key alone would be asked for a model it does not have (ID234).
  AiModel:
    Type: String
    Default: mock-model
    Description: >-
      The model the reading and the assistants ask for. The default is the name the mock
      answers to.

  # The model's context window, which the agent keeps every request inside (D35, ID304).
  # The mock's model has no profile that says it, so the function is always handed both:
  # a model named here must have its own two values named beside it.
  AiMaxInputTokens:
    Type: Number
    Default: 128000
    MinValue: 1
    Description: >-
      How many input tokens the model takes, the reply's reserve included.

  AiMaxOutputTokens:
    Type: Number
    Default: 16384
    MinValue: 1
    Description: >-
      How many tokens of that the agent keeps free for the model's reply.

Conditions:
  HasAiKey: !Not [!Equals [!Ref AiKeyEntry, ""]]

Resources:
  # Declared rather than left to the function, which would otherwise create a group that
  # outlives the stack and keeps its logs for ever. Rule 18 says what a log line may
  # carry; this says how long it is kept. Fourteen days on development is the retention
  # F15 prices, against a default of forever that is a cost line nobody decided.
  ApiLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - !Join
          - ""
          - - "arn:"
            - !Ref AWS::Partition
            - ":iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      # What the function may do with an uploaded document, and nothing more (ID116).
      # Three actions, on one prefix of one bucket: `u/<user>/<document>` is the only
      # shape of key the API composes (apps/api/src/lib/storage/key.ts), so a key made
      # any other way cannot reach an object even if a handler managed to compose one.
      # No ListBucket: nothing in the product enumerates a bucket, and a role that
      # cannot list is a role that cannot be used to go looking.
      Policies:
        - PolicyName: documents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Join ["", [!GetAtt DocumentsBucket.Arn, "/u/*"]]

  # The API. One function for every route, in response-streaming invoke mode from the
  # first deploy rather than from the slice that needs streaming (ID9): a streaming
  # function serves an ordinary buffered JSON response perfectly well, so splitting into
  # a streaming function and a buffered one would buy nothing and would double what has
  # to be deployed and reasoned about.
  #
  # This stack imports nothing from any other stack of this project, and that absence is
  # what let the data stack be deleted at all: CloudFormation refuses to delete a stack
  # whose exports are in use (S7.5, and invariants.test.ts asserts it).
  Api:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 512
      # Long enough for a run that streams. Waking the database no longer figures in it:
      # Neon's compute answers in roughly half a second where the paused Aurora cluster
      # took fifteen (D19).
      Timeout: 300
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      Code:
        S3Bucket: !Sub job-application-artefacts-${AWS::AccountId}-${AWS::Region}
        S3Key: !Ref ApiArtefactKey
      Environment:
        Variables:
          # The pooled connection string of the Neon project in aws-eu-central-1, held
          # in Secrets Manager and never in this repository (D19). A dynamic
          # reference: CloudFormation reads the secret while it applies the stack, so
          # the function needs no right on Secrets Manager and makes no call to it at
          # cold start. The consequence, and it is the reason the name is written here
          # rather than passed as a parameter: a rotated secret reaches the function on
          # the next deploy, not on the rotation.
          DATABASE_URL: "{{resolve:secretsmanager:jobapp/dev/database-url:SecretString}}"
          # Where the browser reaches this environment, and so the origin each provider
          # sends it back to: the callback registered at each is
          # <APP_URL>/api/auth/callback/<provider> (ID60). Written plainly because it is
          # not a secret, and making it one would hide a public value.
          APP_URL: https://dev.job-application.app
          # The three dev client apps and the value the authentication library signs its
          # session cookies with (ID61, ID71). Dev's registrations are its own, separate
          # from the localhost ones, so a dev misconfiguration cannot reach real users
          # and the secrets rotate independently (D9).
          #
          # One entry, `jobapp/dev/auth`, with a JSON key per value, resolved the way
          # DATABASE_URL above is: CloudFormation reads it while it applies the stack, so
          # the function needs no right on Secrets Manager and makes no call at cold
          # start, and a rotated secret reaches the function on the next deploy rather
          # than on the rotation. A person created the entry by hand, as the connection
          # string was created (D19); no template here creates a secret, so nothing in
          # this repository ever holds one.
          #
          # Absent any of these, the cold start fails naming the field (ID23, and
          # apps/api/src/env.ts): a function that answered with a provider unconfigured
          # would serve a button that leads nowhere.
          GOOGLE_CLIENT_ID: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:googleClientId}}"
          GOOGLE_CLIENT_SECRET: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:googleClientSecret}}"
          MICROSOFT_CLIENT_ID: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:microsoftClientId}}"
          MICROSOFT_CLIENT_SECRET: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:microsoftClientSecret}}"
          LINKEDIN_CLIENT_ID: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:linkedinClientId}}"
          LINKEDIN_CLIENT_SECRET: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:linkedinClientSecret}}"
          BETTER_AUTH_SECRET: "{{resolve:secretsmanager:jobapp/dev/auth:SecretString:betterAuthSecret}}"
          # Where a person's documents go (ID115, ID116, ID128), as one URL whose scheme
          # is the implementation (S7.2). It is set explicitly rather than left to its
          # default: a value that is right only because nobody set it is a value
          # nobody decided — and the flat schema's
          # default is a directory on a container's disk, which is precisely what a
          # deployed function must never fall back to. The bucket's name is a reference
          # rather than a literal, so the function and the resource can never disagree
          # about it.
          STORAGE_URL: !Sub "s3://${DocumentsBucket}"
          # Where the reading's and the assistants' answers come from: the AiBaseUrl
          # parameter, which defaults to this application itself (D14, ID127, ID195). With
          # the default no key is registered anywhere, no Secrets Manager entry is read,
          # and a call in this environment costs nothing and reaches no provider. The day
          # one is reached, the parameter names it and no code changes.
          #
          # The default is this app's own address on purpose. The call never leaves the
          # function: `lib/ai` compares the address it was configured with against APP_URL
          # above and answers itself in process (apps/api/src/lib/ai/own-address.ts), so
          # there is no second invocation, no second slice of the timeout and no signed
          # outbound request. Set explicitly rather than left to the schema's default,
          # which is a laptop's own port and is precisely what a deployed function must
          # never fall back to: it did, and every document came back unread.
          AI_BASE_URL: !Ref AiBaseUrl
          # The model asked for, from the AiModel parameter (ID234).
          AI_MODEL: !Ref AiModel
          # The model's context window, from the two parameters (D35, ID304).
          AI_OPT_MAX_INPUT_TOKENS: !Ref AiMaxInputTokens
          AI_OPT_MAX_OUTPUT_TOKENS: !Ref AiMaxOutputTokens
          # The provider's key, only when AiKeyEntry names an entry, and then only as a
          # dynamic reference resolved while the stack applies (ID214). Absent otherwise,
          # so the schema's throwaway stands and the mock ignores it.
          AI_API_KEY: !If
            - HasAiKey
            - !Sub "{{resolve:secretsmanager:${AiKeyEntry}:SecretString}}"
            - !Ref AWS::NoValue

  # The URL is unreachable except through the distribution, which signs every request it
  # forwards. An unauthenticated function URL would be a second, public front door to the
  # same API with none of the distribution's behaviour on it.
  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Api.Arn
      AuthType: AWS_IAM
      InvokeMode: RESPONSE_STREAM

  # The documents a person uploads (ID116). One bucket per environment, added by the
  # slice that needs it so dev never has a function pointing at a bucket that does not
  # exist.
  #
  # It is reached by the function and by nothing else: it is not an origin of the
  # distribution, it has no bucket policy granting anyone anything, and every public
  # route into it is blocked. The name is left to CloudFormation, unlike the web
  # bucket's, because no other stack has to refer to it: the function is handed it as a
  # reference in the same template.
  #
  # DeletionPolicy Delete matches the rest of this stack: development is rebuildable
  # from the repository, and what a person uploaded to it is their own test data.
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The Angular bundle. Reached only through the distribution, as the API is.
  #
  # Named rather than left to CloudFormation, because the Deploy stack has to grant the
  # pipeline the right to sync into it and a policy in another stack cannot refer to a
  # name that will not exist until this one is applied.
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub job-application-web-dev-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Nothing may reach the bucket over plain HTTP, not even a principal that is
          # otherwise allowed to.
          - Effect: Deny
            Principal:
              AWS: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Join ["", [!GetAtt WebBucket.Arn, "/*"]]
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Origin access control: CloudFront signs its request to the bucket, and the
          # condition names the one distribution whose signature is accepted.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Join ["", [!GetAtt WebBucket.Arn, "/*"]]
            Condition:
              StringEquals:
                AWS:SourceArn: !Join
                  - ""
                  - - "arn:"
                    - !Ref AWS::Partition
                    - ":cloudfront::"
                    - !Ref AWS::AccountId
                    - ":distribution/"
                    - !Ref Distribution

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: app-dev-web-bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: app-dev-api-function-url
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # The other half of AWS_IAM on the function URL: the distribution signs, and these say
  # whose signature the function accepts.
  #
  # TWO permissions, not one. Every guide written before October 2025 grants only
  # lambda:InvokeFunctionUrl, and a function URL created after that date also needs
  # lambda:InvokeFunction or the call is refused with 403 before the function is ever
  # invoked. The first deploy failed exactly there: textbook configuration, an empty log
  # group, and CloudFront's SPA fallback turning the 403 into a 200 page.
  ApiInvokeFromDistribution:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt ApiFunctionUrl.FunctionArn
      Principal: cloudfront.amazonaws.com
      SourceArn: !Join
        - ""
        - - "arn:"
          - !Ref AWS::Partition
          - ":cloudfront::"
          - !Ref AWS::AccountId
          - ":distribution/"
          - !Ref Distribution

  ApiInvokeFunctionFromDistribution:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ApiFunctionUrl.FunctionArn
      Principal: cloudfront.amazonaws.com
      SourceArn: !Join
        - ""
        - - "arn:"
          - !Ref AWS::Partition
          - ":cloudfront::"
          - !Ref AWS::AccountId
          - ":distribution/"
          - !Ref Distribution

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - dev.job-application.app
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Europe and North America. The visitors are Swiss and the edge locations that
        # cost extra serve neither of them.
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: web-bucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            # Required on an S3 origin and required to be empty when origin access
            # control is used: the empty string is what says "not an origin access
            # identity", which is the older mechanism this replaces.
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-function-url
            # A function URL is an https endpoint, so CloudFront treats it as a custom
            # origin. The host is the middle segment of the URL the function URL yields.
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # The managed CachingOptimized policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-function-url
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # The managed CachingDisabled policy. An API response is never cached, and
            # neither is a stream.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # The managed AllViewerExceptHostHeader policy: everything the viewer sent
            # except the host header. The exception is not cosmetic — the signature the
            # distribution computes covers the host it is sending to, so forwarding the
            # viewer's host makes every signed request fail. x-amz-content-sha256, which
            # the browser and the deploy check both set, rides through on this policy.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            # Compression off, and this is the setting that silently breaks streaming
            # when it is on: CloudFront buffers a response it intends to compress, so
            # every event of a server-sent stream arrives at the end, together, and the
            # page still renders correctly. A test that reads content passes. Only a test
            # that measures arrival fails, which is why e2e/stream.spec.ts measures
            # arrival.
            Compress: false
        # The page is a single-page application: a deep link is a path S3 has no object
        # for, and the router resolves it in the browser. A bucket behind origin access
        # control answers 403 for a missing key, never 404 (the distribution may read an
        # object, not list the bucket), so 403 is the one code that means "a deep link".
        #
        # ONLY 403, and this is a decision rather than an omission (S9.3). These mappings
        # are distribution-wide: CloudFront cannot scope them to one behaviour, so a code
        # mapped here is mapped for /api/* too. With 404 mapped as well, a run the API
        # does not know answered the page with status 200, and the browser could not
        # tell an error from a screen. The API answers 404 for what it cannot find and
        # never a bare 403, so keeping the 403 mapping alone lets every API error pass
        # through as itself. The one 403 that can still come back as the page is not the
        # API's: the function URL refuses an unsigned request with 403, which is what a
        # body sent without x-amz-content-sha256 looks like — and why the client and the
        # deploy check both set that header. A CloudFront Function on the API behaviour
        # would remove even that case at the price of a second resource and code that
        # only a deploy can prove; this shape is one line shorter and provable from the
        # template, which tests/invariants.test.ts does.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # Z2FDTNDATAQYW2 is CloudFront's own hosted zone id. It is a constant of the aws
  # partition, the same for every distribution there has ever been.
  AliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z01268721BDDLWGJVLJS8
      Name: dev.job-application.app.
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName

  SiteUrl:
    Value: https://dev.job-application.app

  # Read by the pipeline: the bundle is synced into the bucket and /index.html is then
  # invalidated, which is the pair of things BucketDeployment used to do from inside the
  # stack.
  DistributionId:
    Value: !Ref Distribution

  WebBucketName:
    Value: !Ref WebBucket
