AWSTemplateFormatVersion: "2010-09-09"

# USED ONCE, THEN DELETED. See ../import-runbook.md, step 4.
#
# A create-by-import change set may contain only the resources being imported, so this is
# Dns.yaml reduced to the two that survive the old stack: the hosted zone, which cannot be
# recreated without the domain going dark, and the alert topic, whose subscription is
# confirmed. Step 5 of the runbook applies the real Dns.yaml on top and adds the rest.
#
# Keep the properties identical to Dns.yaml: CloudFormation compares them against the
# live resources and refuses an import that disagrees.
Description: The hosted zone for job-application.app, the alert topic and the spend alarm.

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: job-application.app.
      HostedZoneConfig:
        Comment: job-application.app. Name servers set at Spaceship, the registrar.

  Alerts:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DisplayName: job-application.app alerts
