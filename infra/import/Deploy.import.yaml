AWSTemplateFormatVersion: "2010-09-09"

# USED ONCE, THEN DELETED. See ../import-runbook.md, step 4.
#
# Deploy.yaml reduced to the two resources that survive the old stack. The OIDC provider
# because an account may hold only one per URL, so a second cannot be created beside it;
# the role because its name is fixed and is written into a repository variable the
# workflow reads.
#
# The role has no policy here. The old one was deleted with the old stack and the new one
# is created by step 5, which is why the pipeline cannot deploy between step 3 and step 5.
Description: GitHub OIDC provider and the deployment role. Deployed once, from a laptop.

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: github-actions-deploy-dev
      Description: Assumed by GitHub Actions on a push to main, to deploy the development environment.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Ref GitHubProvider
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Ovich/job-application-ai:ref:refs/heads/main
