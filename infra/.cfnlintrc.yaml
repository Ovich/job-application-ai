# cfn-lint reads the templates in this directory against CloudFormation's own resource
# specification, which is the half of a template's correctness the invariants cannot see:
# they assert what must not appear, and would happily agree on a property that does not
# exist. Run it from here — `cd infra && cfn-lint` — which is where it looks for this
# file. CI does the same (.github/workflows/check.yml).
#
# The glob rather than a list, so a stack added later is linted without anybody
# remembering, and so that deleting infra/import after the one import it exists for does
# not leave a name here pointing at nothing.
templates:
  - "**/*.yaml"

# No rule is turned off. One was: W3010, "avoid hardcoding availability zones", because
# the data stack named eu-central-1a and eu-central-1b rather than call Fn::GetAZs. That
# stack is deleted and no template names a zone any more (D19, S7.8).
