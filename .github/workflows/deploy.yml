# A merge to main puts the page on the internet. Nobody runs a command.
#
# The order is the board's and the spec's, and two parts of it are deliberate rather
# than incidental. The checks come first and the deploy does not start unless they
# passed. And the migration runs AFTER the application, which means new code has to
# tolerate the old schema for the minute between the two, and a failed migration leaves
# working code with the deploy already reported successful; recovering is re-tagging,
# not a rollback. Both consequences are written in the spec and are the accepted cost of
# never having a schema ahead of the code that reads it.
#
# This pipeline no longer judges what it deployed. Checking the environment is
# `e2e-dev.yml`, run by hand from the Actions tab, and the reason is what the check
# could never do rather than what it costs: it runs after the environment is already
# updated, so a red verdict stops nothing — the deploy it grades has happened whatever it
# says. Paying four minutes of the plan's minutes on every merge for an answer nobody was
# waiting on, and which blocks nothing when it is bad, is a poor trade. D9 described the
# step in a comment and never made it real; D20 did, on 2026-09-10; it became a job of its
# own and then a workflow of its own on 2026-09-19.
#
# What the deploy still owes a reader is that CloudFormation reporting success is not the
# same as the environment working. That question is now asked deliberately — after a
# doubtful deploy, after rotating `jobapp/dev/auth`, before trusting dev for a demo —
# rather than automatically and unread.
#
# What made it unrunnable before was what it drove: the run skeleton, so every merge
# wrote runs into the domain tables, which on prod means writing product data as a side
# effect of shipping. The health route reads and writes nothing, so the objection is
# gone with the skeleton.
#
# WHAT THIS FILE DOES THAT A TEMPLATE CANNOT (D17, ID52). `infra/` is CloudFormation
# YAML, so the two jobs the CDK L2 constructs did from inside a stack are steps here
# instead: `NodejsFunction` bundled the API with esbuild and uploaded it, and
# `BucketDeployment` unzipped the web bundle into S3 and invalidated the entry document.
# Both are below, in the open. The stacks are applied with `aws cloudformation deploy`,
# each one handed the execution role the Deploy stack declares, so the rights to create
# a distribution or a cluster belong to CloudFormation and not to this workflow's own
# identity.
name: deploy

on:
  push:
    branches: [main]

# One deploy at a time, and never cancelled halfway: a cancelled CloudFormation update
# leaves a stack in a state the next run has to clean up by hand.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy-dev:
    needs: check
    runs-on: ubuntu-24.04
    # Bounded because the concurrency group above is never cancelled: without a timeout a
    # CloudFormation wait that hangs holds `deploy-dev` for GitHub's default six hours and
    # every later merge queues behind it.
    timeout-minutes: 30
    permissions:
      # What lets Actions mint the token AWS trusts. Without it there is no token and
      # the role cannot be assumed; nothing else here needs any permission at all.
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT: "917993967998"
      # The certificate's region, and CloudFront's. Not a preference: CloudFront reads a
      # certificate from us-east-1 and from nowhere else.
      CERTIFICATE_REGION: us-east-1
      # The names the templates carry, read here so a reader of this file can see what
      # the commands below are talking about without opening infra/.
      APP_STACK: App-dev
      CERT_STACK: Cert-dev
      # Where the development database's connection string lives. Neon issues it, a
      # person put it here, and nothing in the repository holds it (D19).
      DATABASE_SECRET: jobapp/dev/database-url
      # `jobapp/dev/auth` — the three dev client apps and the session signing secret — is
      # deliberately absent here. App-dev.yaml resolves that entry itself while the stack
      # is applied, so this workflow never reads it; `e2e-dev.yml` does, because signing a
      # person in by writing the session row needs the secret the function verifies with
      # (ID101). The deploy role may read that entry and the one above, and no other.
      # Stamped on every stack, and from there onto every resource that supports a tag.
      # A resource whose identifier AWS assigned (a distribution id, a hosted zone id)
      # can never say what it is; its tags are the only place that meaning can live, and
      # a tag applied by hand is gone the next time the stack is deployed.
      STACK_TAGS: "Project=job-application Environment=dev ManagedBy=cloudformation"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No access key exists on either side. Actions presents a signed token saying which
      # repository and which ref is running, and the role's trust condition names exactly
      # `refs/heads/main`, so a fork or another branch gets credentials refused rather
      # than a deploy it did not intend.
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      # Who CloudFormation is while it applies each stack. The name is fixed by
      # Deploy.yaml, so it can be written out here rather than looked up — which matters
      # for the one stack that declares it: the first `Deploy` apply of all had to be
      # done by a person with rights of their own, because the role did not exist yet.
      - name: Name the execution role
        id: roles
        run: |
          set -euo pipefail
          echo "cloudformation=arn:aws:iam::${AWS_ACCOUNT}:role/job-application-cloudformation-execution" >> "$GITHUB_OUTPUT"

      # The project-wide stacks first. They change rarely, and deploying them from here
      # rather than from a laptop is what keeps the account and the repository in
      # agreement; the bootstrap deployed them once by hand, and that was the exception.
      #
      # CAPABILITY_NAMED_IAM because these stacks create roles with names the rest of the
      # system refers to. --no-fail-on-empty-changeset so that a merge touching neither
      # stack is a no-op rather than a red run.
      - name: Deploy the shared stacks
        env:
          EXECUTION_ROLE: ${{ steps.roles.outputs.cloudformation }}
        run: |
          set -euo pipefail
          for stack in Deploy Dns; do
            aws cloudformation deploy \
              --template-file "infra/${stack}.yaml" \
              --stack-name "$stack" \
              --role-arn "$EXECUTION_ROLE" \
              --capabilities CAPABILITY_NAMED_IAM \
              --tags $STACK_TAGS "Component=$stack" \
              --no-fail-on-empty-changeset
          done

      # What NodejsFunction did. esbuild bundles the entry point with nothing treated as
      # already present on the platform: which packages the Node 24 runtime ships is a
      # runtime detail that changes without notice, and a wrong guess breaks in the cloud
      # only.
      #
      # The key is the commit SHA, so an artefact is traceable to the code it came from
      # and a redeploy of the same commit changes nothing in the stack.
      #
      # ESM, and `.mjs`, because the source is ESM and says so: `apps/api` is
      # `"type": "module"`, and the mock resolves its own directory from
      # `import.meta.url`. Bundled as CommonJS — esbuild's default for this platform —
      # `import.meta` is empty, that line throws `Invalid URL` while the module is still
      # loading, and every route is dead behind a distribution that falls back to the
      # page. Lambda reads `index.mjs` for the handler `index.handler` as it reads
      # `index.js`, so nothing else moves.
      #
      # The banner is what ESM costs. Dependencies bundled in here are CommonJS and call
      # `require` at load; in an ESM output esbuild routes those through a shim that
      # throws `Dynamic require of "fs" is not supported` unless a `require` exists, and
      # module scope in ESM has none. `createRequire` builds the one those packages
      # expect. It is written without a space so that the flag survives being read back
      # out of this file by the test below.
      #
      # `tests/deploy/api-bundle.test.ts` builds this same command on every push, fails
      # on a warning, and — because a warning is not the only way a bundle can be dead —
      # loads the result and asks it for its handler. Both of this file's ways of
      # shipping a broken function got past a green pipeline before that test existed.
      - name: Bundle the API
        id: api
        run: |
          set -euo pipefail
          pnpm exec esbuild apps/api/src/lambda.ts \
            --bundle --platform=node --target=node24 --format=esm --minify --sourcemap \
            --banner:js='import{createRequire}from"node:module";globalThis.require=createRequire(import.meta.url);' \
            --outfile=dist/lambda/index.mjs
          # The answers the function serves itself. `App-dev.yaml` points `AI_BASE_URL`
          # at this app's own mock by default, which the function answers in process,
          # reading these from beside the bundle at run time; nothing else puts them in
          # the zip.
          cp -R apps/api/src/mock-answers/documents dist/lambda/documents
          (cd dist/lambda && zip --quiet --recurse-paths ../api.zip .)
          key="api/${GITHUB_SHA}.zip"
          aws s3 cp dist/api.zip "s3://job-application-artefacts-${AWS_ACCOUNT}-${AWS_REGION}/${key}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Built before App-dev, as the API bundle is: a missing bundle should fail here,
      # where the message says what is wrong, rather than inside a sync.
      - name: Build the web bundle
        run: pnpm --filter @app/web run build

      # In us-east-1, and the only stack that is. Its output is read straight afterwards
      # because a CloudFormation export cannot be imported across a region: the ARN
      # travels as a parameter instead.
      - name: Deploy the certificate
        env:
          EXECUTION_ROLE: ${{ steps.roles.outputs.cloudformation }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region "$CERTIFICATE_REGION" \
            --template-file infra/Cert-dev.yaml \
            --stack-name "$CERT_STACK" \
            --role-arn "$EXECUTION_ROLE" \
            --tags $STACK_TAGS "Component=certificate" \
            --no-fail-on-empty-changeset

      - name: Read the certificate ARN
        id: certificate
        run: |
          set -euo pipefail
          arn=$(aws cloudformation describe-stacks --region "$CERTIFICATE_REGION" \
            --stack-name "$CERT_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
            --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Deploy the application
        env:
          EXECUTION_ROLE: ${{ steps.roles.outputs.cloudformation }}
          ARTEFACT_KEY: ${{ steps.api.outputs.key }}
          CERTIFICATE_ARN: ${{ steps.certificate.outputs.arn }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infra/App-dev.yaml \
            --stack-name "$APP_STACK" \
            --role-arn "$EXECUTION_ROLE" \
            --capabilities CAPABILITY_IAM \
            --tags $STACK_TAGS "Component=application" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ApiArtefactKey=$ARTEFACT_KEY" \
              "CertificateArn=$CERTIFICATE_ARN"

      # What BucketDeployment did, in two commands instead of a Lambda in a layer.
      # --delete is what prunes the previous build's chunks. Only the entry document is
      # invalidated, because everything else carries a content hash in its name and an
      # invalidation of it would be paid for and would change nothing.
      - name: Publish the web bundle
        run: |
          set -euo pipefail
          distribution=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          bucket=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" \
            --output text)
          aws s3 sync apps/web/dist/web/browser "s3://${bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths /index.html

      # As the application does, with the application's own credential: if this string
      # cannot migrate, it cannot serve requests either, and this is where that is found
      # out. It is the only step that reads the secret, and the deploy role may read no
      # other. The mask is what keeps a later step or a stack trace from printing it.
      - name: Migrate
        run: |
          set -euo pipefail
          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_SECRET" --query SecretString --output text)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm --filter @app/db run db:migrate
