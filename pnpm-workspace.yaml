packages:
  - apps/web
  - apps/api
  - packages/db

# pnpm 11 runs no dependency's install script unless it is named here. drizzle-kit
# and the pipeline's own bundling step need esbuild's; the other three are Angular's toolchain, whose build cache (lmdb,
# msgpackr-extract) and file watcher (@parcel/watcher, through sass) are native.
allowBuilds:
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  "@parcel/watcher": true
